name: Build SideStore IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.editorconfig'

jobs:
  build-ipa:
    name: Build SideStore IPA
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Ensure Submodules Cloned
        run: |
          git submodule update --init --recursive || true
          if [ ! -f "Dependencies/AltSign/Package.swift" ]; then
            echo "Cloning AltSign dependency..."
            rm -rf Dependencies/AltSign
            git clone --depth 1 -b master https://github.com/SideStore/AltSign Dependencies/AltSign
          fi
          if [ ! -f "Dependencies/minimuxer/Package.swift" ]; then
            echo "Cloning minimuxer dependency..."
            rm -rf Dependencies/minimuxer
            git clone --depth 1 -b develop https://github.com/SideStore/minimuxer Dependencies/minimuxer
          fi

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer || \
          sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer || \
          sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || \
          sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer || \
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install Build Tools
        run: |
          brew install ldid xcbeautify

      - name: Build SideStore
        run: |
          python3 scripts/ci/workflow.py build

      - name: Upload SideStore IPA
        uses: actions/upload-artifact@v4
        with:
          name: SideStore-IPA
          path: SideStore.ipa
          retention-days: 30

      - name: Upload dSYMs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SideStore-dSYMs
          path: SideStore.dSYMs.zip
          retention-days: 14
